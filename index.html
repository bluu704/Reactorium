<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reactorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fraunces:opsz,wght@9..144,600&family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif:wght@500;600&display=swap">
<style>
:root{
  /* 레이아웃: 어두운 유리 계기판 + 코발트 프레임 속 시료 트레이, 오른쪽엔 반응 기록과 시약장 */
  --bg:#edf0f6; --dot:rgba(43,79,216,.08); --panel:#ffffff; --panel2:#f5f7fb; --ink:#11172a; --muted:#5a6480; --line:#dfe3ec;
  --tile:#ffffff; --tile2:#eef1f6; --tile-edge:#cdd3df; --mol:#eef0f5; --mol2:#d6dbe5;
  --accent:#2b4fd8; --accent-ink:#ffffff; --accent-soft:#e7ecfd;
  --frame1:#4a6cea; --frame2:#22358f; --tray:#f2f4f9;
  --inst:#0e1428; --inst2:#18213f; --inst-ink:#eef1fb; --inst-muted:#8d98b8; --inst-line:#2a3453; --inst-accent:#9cb0ff;
  --hot:#d43f26; --cold:#1a83cc; --good:#178a50; --warn:#a87203; --plasma:#9338d4; --aq:#2b7fd0;
  --i-hot:#ff7a5c; --i-cold:#5cc0ff; --i-plasma:#cf8dff;
  --scrim:rgba(10,14,30,.5); --toast:#ffffff;
  --sh-card:0 1px 2px rgba(17,23,42,.05),0 12px 32px -16px rgba(17,23,42,.25);
  --sh-tile:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(17,23,42,.07),0 2px 5px rgba(17,23,42,.16);
  --f-disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sym:"Noto Serif","Times New Roman",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-word:"Fraunces","Gowun Batang",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080b15; --dot:rgba(134,160,255,.07); --panel:#111728; --panel2:#0d1221; --ink:#e7ebf6; --muted:#8f9bb8; --line:#222a42;
  --tile:#212943; --tile2:#192036; --tile-edge:#343e5c; --mol:#2a3350; --mol2:#1d2540;
  --accent:#8aa3ff; --accent-ink:#0a0e1a; --accent-soft:#1c2550;
  --frame1:#2d45ae; --frame2:#10184a; --tray:#0c1120;
  --inst:#05080f; --inst2:#0f1528; --inst-line:#1f2842;
  --hot:#ff6b4e; --cold:#4fb4ff; --good:#3fcd88; --warn:#f1b43c; --plasma:#c47bff; --aq:#5aa8f0;
  --scrim:rgba(0,0,0,.65);
  --sh-card:inset 0 1px 0 rgba(255,255,255,.03),0 14px 32px -16px rgba(0,0,0,.8);
  --sh-tile:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#080b15; --dot:rgba(134,160,255,.07); --panel:#111728; --panel2:#0d1221; --ink:#e7ebf6; --muted:#8f9bb8; --line:#222a42;
  --tile:#212943; --tile2:#192036; --tile-edge:#343e5c; --mol:#2a3350; --mol2:#1d2540;
  --accent:#8aa3ff; --accent-ink:#0a0e1a; --accent-soft:#1c2550;
  --frame1:#2d45ae; --frame2:#10184a; --tray:#0c1120;
  --inst:#05080f; --inst2:#0f1528; --inst-line:#1f2842;
  --hot:#ff6b4e; --cold:#4fb4ff; --good:#3fcd88; --warn:#f1b43c; --plasma:#c47bff; --aq:#5aa8f0;
  --scrim:rgba(0,0,0,.65);
  --sh-card:inset 0 1px 0 rgba(255,255,255,.03),0 14px 32px -16px rgba(0,0,0,.8);
  --sh-tile:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{font-size:.62em;line-height:0}
.app{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;flex:none;filter:drop-shadow(0 4px 8px rgba(43,79,216,.35))}
.brand h1{margin:0;font-family:var(--f-word);font-weight:600;font-size:28px;letter-spacing:-.01em;line-height:1;font-variation-settings:"opsz" 72}
.brand h1.ko{font-family:"Gowun Batang",var(--f-word);font-weight:700;letter-spacing:0;font-size:26px}
.langbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;color:var(--muted);box-shadow:var(--sh-card)}
.langbtn:hover{color:var(--accent);border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:var(--sh-card);transition:border-color .15s,color .15s,background .15s}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:var(--sh-card)}
.seg .ibtn{border:0;box-shadow:none;width:36px;height:34px;border-radius:10px;background:none;color:var(--muted)}
.seg .ibtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* layout */
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,548px) minmax(0,1fr);align-items:start}.side{position:sticky;top:12px}}
.main,.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--sh-card)}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:0 0 8px;text-transform:uppercase}
/* status */
.status{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;padding:12px}
.goals{display:flex;flex-direction:column;gap:6px;min-width:0;padding:4px 2px 4px 4px}
.goal{display:flex;align-items:center;gap:8px;min-width:0}
.pill{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:8px;padding:1px 7px;min-width:56px;text-align:center}
.goal.done .pill{background:var(--ink);color:var(--panel)}
.goal .gt{font-family:var(--f-sym);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gt.txt{font-family:var(--f-body);font-size:13px;font-weight:700}
.goal.gmain .gt{font-size:22px}
.goal.done .gt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.sub-eyebrow{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:.04em}
.clear{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clear b{color:var(--good)}
.inst{background:linear-gradient(165deg,var(--inst2),var(--inst));color:var(--inst-ink);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--inst-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.temp{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.temp .tv{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1}
.thermo{width:12px;height:26px}
.inst-sub{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--inst-muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--inst-line);padding-top:7px}
.inst-sub b{color:var(--inst-ink);font-weight:500}
.meter{display:flex;flex-direction:column;gap:4px}
.mlab{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--inst-muted);font-weight:700}
.mlab b{margin-left:auto;font-family:var(--f-mono);color:var(--inst-ink);font-weight:500}
.mlab svg{width:12px;height:12px}
.mtrack{height:6px;border-radius:99px;background:var(--inst-line);overflow:hidden}
.mtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--inst-accent),#d8e0ff);border-radius:99px;transition:width .3s}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;min-height:20px}
.chip{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.chip.hot{color:var(--i-hot)}.chip.cold{color:var(--i-cold)}.chip.pl{color:var(--i-plasma)}.chip.p{color:var(--inst-accent)}
/* controls */
.ctl{display:grid;gap:12px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.row label{font-weight:700;font-size:13px}
.row output{font-family:var(--f-mono);font-size:13px;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--cold),var(--line) 45%,var(--hot))}
input[type=range]#pset::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--line),var(--accent))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--cold),var(--line) 45%,var(--hot))}
input[type=range]#pset::-moz-range-track{background:linear-gradient(90deg,var(--line),var(--accent))}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.presets{display:flex;gap:5px;flex-wrap:wrap;grid-column:2/4}
.presets button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:2px 9px;font-size:12px;font-family:var(--f-mono)}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.presets button:disabled{opacity:.35;cursor:not-allowed}
.uvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:700}
.toggle .knob{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.toggle .knob::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle[aria-pressed="true"]{border-color:var(--plasma);color:var(--plasma)}
.toggle[aria-pressed="true"] .knob{background:var(--plasma)}
.toggle[aria-pressed="true"] .knob::after{left:14px}
.tip{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
.tipbox{background:var(--accent-soft);border-radius:10px;padding:9px 12px;color:var(--ink)}
/* board */
.boardwrap{background:linear-gradient(160deg,var(--frame1),var(--frame2));border-radius:22px;padding:10px;box-shadow:var(--sh-card),inset 0 1px 0 rgba(255,255,255,.18)}
.tray{background:var(--tray);border-radius:14px;padding:6px;box-shadow:inset 0 2px 8px rgba(0,0,0,.18)}
.board{position:relative;width:min(100%,calc((100vh - 60px)*5/7));min-width:260px;max-width:100%;margin:0 auto;aspect-ratio:5/7;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size}
.tile{position:absolute;width:20%;height:calc(100%/7);padding:3px;transition:left .22s ease,top .22s ease;container-type:inline-size}
.face{position:relative;height:100%;border-radius:8px;border:1px solid var(--tile-edge);background:linear-gradient(180deg,var(--tile),var(--tile2));box-shadow:var(--sh-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:transform .12s}
.k-mol .face,.k-aq .face{background:linear-gradient(180deg,var(--mol),var(--mol2))}
.tile .z{position:absolute;left:9%;top:6%;font-family:var(--f-sym);font-size:13cqw}
.tile .sym{font-family:var(--f-sym);font-weight:500;font-size:42cqw;line-height:1;margin-top:6%;white-space:nowrap;position:relative}
.tile .sym.m{font-size:31cqw}.tile .sym.s{font-size:24cqw}.tile .sym.xs{font-size:18cqw}
.tile .nm{font-size:11.5cqw;margin-top:6%;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;position:relative;color:var(--ink);opacity:.85}
.tile .phb{position:absolute;right:7%;bottom:5%;font-family:var(--f-mono);font-size:10cqw;color:var(--muted)}
.tile .catb{position:absolute;right:7%;top:6%;font-size:9.5cqw;font-weight:700;color:var(--good)}
.gauge{position:absolute;left:7%;right:7%;top:9%;height:10%}
.gauge::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink);opacity:.7}
.gauge .tk{position:absolute;top:0;bottom:0;width:1px;background:var(--ink)}
.gauge .dot{position:absolute;top:50%;width:7cqw;height:7cqw;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.tint{position:absolute;left:0;right:0;bottom:0;background:var(--tint);opacity:.55;pointer-events:none}
.k-aq .tint{height:42%;opacity:.32}
.k-aq.colored .tint{opacity:.62}
.k-mol .tint{height:22%}
.ph-g.k-mol .face,.ph-g.k-el .face{border-style:dashed;border-width:1.5px}
.ph-g.k-mol .sym{opacity:.82}
.ph-l .face{box-shadow:var(--sh-tile),inset 0 -5px 0 color-mix(in srgb,var(--aq) 25%,transparent)}
.ph-sc .face{background:linear-gradient(135deg,var(--mol),color-mix(in srgb,var(--aq) 30%,var(--mol)))}
.ph-plasma .face{border-color:var(--plasma);background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--plasma) 45%,var(--tile)),var(--tile) 75%);animation:pulse 1.1s ease-in-out infinite}
.frozen .face{background:linear-gradient(180deg,color-mix(in srgb,var(--cold) 18%,var(--mol)),var(--mol2))}
@keyframes pulse{50%{box-shadow:0 0 14px color-mix(in srgb,var(--plasma) 70%,transparent)}}
.tile.sel .face{outline:3px solid var(--accent);outline-offset:-2px;transform:scale(.95)}
.tile.born .face{animation:born .45s ease-out}
@keyframes born{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.pathsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:13cqw;color:var(--toast);white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--glow),0 0 10px var(--glow),0 0 22px var(--glow),0 2px 0 var(--glow);animation:toastA 1.5s ease-out forwards;z-index:5}
.toast.small{font-size:8cqw}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-weight:600;font-size:4.2cqw;pointer-events:none;white-space:nowrap;z-index:4;animation:flA 1.6s ease-out forwards;text-shadow:0 0 3px var(--panel),0 0 6px var(--panel)}
.fl.word{font-family:var(--f-body);font-weight:900;font-size:3.8cqw}
@keyframes flA{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-9cqw}}
.boardbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;padding:0 4px}
.boardbar .tip{color:rgba(255,255,255,.82)}
.boardbar .btns{display:flex;gap:6px;flex-wrap:wrap}
.boardbar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.boardbar .btn:hover{background:rgba(255,255,255,.24)}
/* log */
.logtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lname{font-weight:900;font-size:16px}
.lname.ok{color:var(--good)}.lname.no{color:var(--hot)}
.eq{font-family:var(--f-sym);font-size:18px;margin:8px 0 10px;overflow-x:auto;white-space:nowrap;padding:8px 10px;background:var(--panel2);border-radius:10px;border:1px solid var(--line)}
.eq small{font-family:var(--f-mono);font-size:.6em;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.metric{border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-width:0}
.metric span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.metric b{font-family:var(--f-mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric b.neg{color:var(--good)}.metric b.pos{color:var(--hot)}
.lmsg{margin:10px 0 0;font-size:13px;line-height:1.65}
.hist{margin:12px 0 0;padding:10px 0 0;list-style:none;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.hist li{font-size:12.5px;display:flex;gap:6px;align-items:baseline;min-width:0}
.hist li .h-eq{font-family:var(--f-sym);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;max-height:310px;overflow-y:auto;padding:2px}
.shopitem{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.shopitem:hover{border-color:var(--accent)}
.shopitem .sf{font-family:var(--f-sym);font-size:15px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.shopitem .sn{font-size:10.5px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.shopitem .sc{font-family:var(--f-mono);font-size:11px;font-weight:600}
.shopitem:disabled{opacity:.4;cursor:not-allowed}
.shopfilter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.shopfilter button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 11px;font-size:12px}
.shopfilter button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
@media (min-width:700px){.sheet{border-radius:22px}}

.boardbar{justify-content:center}

/* ── v4: bigger type, ink labels, one-screen layout ── */

@keyframes nudge{50%{transform:translateX(3px)}}
.clearline{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;color:var(--good)}
.clearline svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.shopgrid{max-height:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.shopitem{padding:4px 3px;border-radius:9px}
.shopitem .sf{font-size:16px}.shopitem .sn{font-size:11px}.shopitem .sc{font-size:11px}
.shopfilter{margin-bottom:8px}
.achv{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.ach{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--inst2),var(--inst));color:#fff;border:1px solid var(--inst-line);border-radius:16px;padding:10px 18px 10px 10px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);animation:achIn .45s cubic-bezier(.2,1.4,.4,1)}
.ach.out{opacity:0;transform:translateY(16px);transition:all .5s}
.ach-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f5c344,#e08a1c)}
.ach-ic svg{width:22px;height:22px;fill:none;stroke:#3a2200;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ach small{display:block;font-size:11.5px;color:#f5c344;font-weight:800;letter-spacing:.04em}
.ach b{font-size:15px}
@keyframes achIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.qgrid h3{font-size:14px;margin:0 0 10px;font-weight:900}
.qtxt{gap:2px}
.qtxt b{font-size:28px;line-height:1}
.qtxt span{font-size:13px;font-style:italic;color:var(--muted);line-height:1}
@media (min-width:900px) and (min-height:620px){
  .layout{--bw:min(calc((100vh - 170px) * 5 / 7 + 36px),46vw);grid-template-columns:minmax(290px,1fr) var(--bw) minmax(300px,1fr)}
  .shopcard{flex:none;min-height:0;display:block}
  .colA .status{flex:none}
  .colC .ctl{flex:none}
  .colB .boardwrap{width:100%}
}

/* ── v6 ── */
.gcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.gcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.gcol .sub-eyebrow{margin:0 0 2px}
.goal.gmain .gt{font-size:22px}
.status{gap:10px;padding:14px 16px}
.res{gap:8px;padding-top:10px}
.shopitem .sf.long{font-size:13px;letter-spacing:-.02em}
.qtabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.qtabs button{flex:1 1 auto;border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.qtabs button span{font-family:var(--f-mono);font-size:11.5px;opacity:.8}
.qtabs button[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--sh-card)}
.qhero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:14px}
.qhero b{font-family:var(--f-mono);font-size:30px;font-weight:500}
.qhero span{font-family:var(--f-mono);color:var(--muted);margin-left:4px}
.qhero small{color:var(--muted);font-weight:700;font-size:12.5px}
.qbar,.qmini{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i,.qmini i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f5c344,#e08a1c)}
.qmini{height:5px;margin-top:6px}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.qc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2)}
.qc .qic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--line)}
.qc .qic svg{width:21px;height:21px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qc.ok{background:linear-gradient(135deg,color-mix(in srgb,#f5c344 14%,var(--panel)),var(--panel));border-color:color-mix(in srgb,#e08a1c 45%,var(--line))}
.qc.ok .qic{background:linear-gradient(135deg,#f5c344,#e08a1c)}
.qc.ok .qic svg{stroke:#3a2200}
.qct{min-width:0}
.qct b{display:block;font-size:14.5px}
.qct small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.qst{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;background:var(--line);color:var(--muted);white-space:nowrap}
.qc.ok .qst{background:var(--good);color:#fff}
.sheet{max-width:760px}
@media (min-width:900px) and (min-height:620px){
  .colA .shopcard{flex:1 1 auto}
  .xside{display:flex;flex-direction:column}
  .xside > .card:last-child{flex:1 1 auto}
}

/* ── v7 ── */
.qcard{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.qcard .qinfo{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qcard .qinfo .eyebrow{margin:0}
#fu-viz{width:100%;height:150px;border-radius:14px;display:block;background:#05070e;border:1px solid var(--inst-line)}

/* ── v8 ── */
@media (min-width:900px) and (min-height:620px){
  .colA .shopcard{flex:1 0 auto;min-height:auto}
  .colA,.colC{overflow-y:auto}
  #view-fusion .xside{overflow:hidden;gap:10px}
  #view-fusion .xside .card{padding:12px 14px}
  #view-fusion .qcard{grid-template-columns:clamp(84px,13vh,120px) minmax(0,1fr);gap:10px}
  #view-fusion .qcard .qring{width:clamp(84px,13vh,120px);height:clamp(84px,13vh,120px)}
  #view-fusion #fu-viz{height:clamp(84px,15vh,140px)}
  #view-fusion .qtxt b{font-size:clamp(18px,3vh,26px)}
  #view-fusion .eq{font-size:14px;padding:7px 10px;margin:6px 0}
  #view-fusion .kvt{font-size:13px;gap:3px 10px}
  #view-fusion .stbar{font-size:12.5px;margin-top:8px;padding:7px 10px;line-height:1.5}
  #view-fusion .xside > .card:last-child{flex:1 1 0;min-height:0;overflow:auto;scrollbar-width:thin}
  #view-electro .xside{gap:10px}
}
@media (min-width:900px) and (max-height:820px){
  .shopitem{padding:2px 3px}.shopitem .sf{font-size:14.5px}.shopitem .sn{font-size:10.5px}.shopgrid{gap:4px}
  .colA .status{padding:10px 14px;gap:6px}.res{padding-top:6px;gap:6px}.resn span{padding:3px 8px}
  .colA{gap:10px}.shopfilter{margin-bottom:6px}
  #view-fusion .kvt{font-size:12.5px;gap:1px 10px}
  #view-fusion .stbar{display:none}
  #view-fusion .qcard .qinfo .eyebrow{display:none}
}

/* ── v9 readability & panels ── */
:root{--muted:#424b66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#b6c0d8}}
:root[data-theme="dark"]{--muted:#b6c0d8}
body{font-size:15.5px;line-height:1.55}
.tip{font-size:14px}
.lmsg{font-size:14.5px;line-height:1.65}
.metric span{font-size:12.5px;opacity:.85}
.metric b{font-size:15px}
.hist li{font-size:14px}
.kvt{font-size:14.5px}
.kvt dt{color:var(--ink);opacity:.8}
.tile .nm{opacity:1;font-weight:500}
.shopitem .sn{font-size:11.5px;color:var(--ink);opacity:.75}
.sub-eyebrow{font-size:13px;font-weight:800}
.logcard{display:flex;flex-direction:column}
.rxstats{flex:none;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.rsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 12px;margin-top:6px}
.rs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;font-size:12.5px;align-items:baseline}
.rs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b{font-size:12px;font-weight:500}
.rs i{grid-column:1/-1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.rs em{display:block;height:100%;background:var(--accent);border-radius:99px}
.balcard,.readcard{display:flex;flex-direction:column}
.lawbox{flex:1 1 auto;min-height:150px;margin-top:10px;display:flex}
.lawbox canvas{width:100%;height:100%;min-height:150px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.series{margin-top:auto;padding-top:12px}
.series svg{width:100%;height:96px;display:block;margin-top:6px}
@media (min-width:900px) and (min-height:620px){
  #view-fusion .xside > .card:last-child{overflow:hidden}
  .hist{min-height:60px}
}
@media (min-width:900px) and (max-height:820px){ .shopgrid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))} .shopitem .sn{font-size:10px} .shopitem .sc{font-size:10.5px} .lawbox,.lawbox canvas{min-height:110px} .rxstats .rsg{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))} }

/* ── v9b ── */
.series svg{height:112px}
.shopgrid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.metric{padding:4px 8px}
.metric b{font-size:14px}
@media (min-width:900px) and (min-height:620px){
  .colC{overflow:hidden}
  .colC .logcard{flex:1 1 0;min-height:0;overflow:hidden}
  .logscroll{flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .logscroll .hist{flex:none;overflow:visible;min-height:0}
}

/* ── v9c ── */
.achv{width:min(420px,calc(100vw - 32px))}
.ach{width:100%;box-sizing:border-box;padding:12px 18px 12px 12px}
.ach > span:last-child{min-width:0;flex:1}
.ach b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px) and (max-height:820px){ .colA .shopcard{padding:12px 14px} .colA .status .goals{gap:4px} }

/* ── v9d: theme-aware equation boxes ── */
:root{--eq1:#f4f7fe;--eq2:#e6ecfa;--eqfg:#121a33;--eqsub:#4a5680;--eqline:#cfd8ee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--eq1:#18213f;--eq2:#0e1428;--eqfg:#f4f6fd;--eqsub:#9fb0dc;--eqline:#2a3453}}
:root[data-theme="dark"]{--eq1:#18213f;--eq2:#0e1428;--eqfg:#f4f6fd;--eqsub:#9fb0dc;--eqline:#2a3453}
.eq,.rxlist .re,.heq,.half .heq{background:linear-gradient(160deg,var(--eq1),var(--eq2));color:var(--eqfg);border-color:var(--eqline)}
.eq small,.rxlist .re small,.heq small{color:var(--eqsub)}
.md blockquote{background:linear-gradient(160deg,var(--eq1),var(--eq2));color:var(--eqfg)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5677f0"/><stop offset="1" stop-color="#1f2f86"/></linearGradient></defs><rect x="1" y="1" width="34" height="34" rx="10" fill="url(#mg)"/><circle cx="18" cy="18" r="3" fill="#fff"/><ellipse cx="18" cy="18" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-width="1.5"/><ellipse cx="18" cy="18" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-width="1.5" transform="rotate(60 18 18)"/><ellipse cx="18" cy="18" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-width="1.5" transform="rotate(-60 18 18)"/></svg>
      <h1>Reactorium</h1>
    </div>
    <nav class="tools">
      <div class="seg" role="group">
        <button class="ibtn" id="m-stage" aria-pressed="true" data-i18n-t="stage"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/></svg></button>
        <button class="ibtn" id="m-lab" aria-pressed="false" data-i18n-t="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.2 9.2A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9V3M7.2 15h9.6"/></svg></button>
        <button class="ibtn" id="m-electro" aria-pressed="false" data-i18n-t="electro"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3M9.5 9.5 7.5 12.5h4l-2 3"/></svg></button>
        <button class="ibtn" id="m-fusion" aria-pressed="false" data-i18n-t="fusion"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.5" ry="5.5"/><ellipse cx="12" cy="12" rx="4.2" ry="2"/><path d="M12 6.5v-3M12 20.5v-3"/><circle cx="17.8" cy="9.2" r="1.1" fill="currentColor"/></svg></button>
      </div>
      <button class="ibtn" id="b-coll" data-i18n-t="coll"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14M9 7h7M9 10.5h5"/></svg></button>
      <button class="ibtn" id="b-quest" data-i18n-t="quest"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20h7M10 17h4"/></svg></button>
      <button class="ibtn" id="b-help" data-i18n-t="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.8.3-1 .8-1 1.6M12 16.6v.2"/></svg></button>
      <button class="ibtn" id="b-lang" data-i18n-t="lang"><svg viewBox="0 0 24 24" class="langic"><rect x="2.5" y="3.5" width="12" height="12" rx="3"/><rect x="9.5" y="8.5" width="12" height="12" rx="3" class="fillbg"/><text x="8.5" y="12.6" text-anchor="middle">가</text><text x="15.5" y="17.8" text-anchor="middle">A</text></svg></button>
      <button class="ibtn" id="b-theme" data-i18n-t="theme"><svg viewBox="0 0 24 24" id="theme-ic"></svg></button>
    </nav>
  </header>

  <div class="layout" id="view-game">
    <section class="colA">
      <div class="card status">
        <div class="goals" id="goals"></div>
        <div class="res" id="resrow">
          <div class="meter" id="ebar"><div class="mlab"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M8 1 3 8h4l-1 5 5-7H7z" fill="currentColor"/></svg><span data-i18n="energy">에너지</span><b id="ev">100</b></div><div class="mtrack"><i id="efill"></i></div></div>
          <div class="resn" id="cbar"><span><small data-i18n="coins">코인</small><b id="coins">60</b></span><span><small data-i18n="supply">보충</small><b id="supply">100</b></span></div>
        </div>
      </div>
      <div class="card shopcard">
        <div class="logtop"><p class="eyebrow" data-i18n="shop">시약장</p><span class="tip" id="shop-note"></span></div>
        <div class="shopfilter" id="shopf"></div>
        <div class="shopgrid" id="shop"></div>
      </div>
    </section>

    <section class="colB">
      <div class="boardwrap">
        <div class="tray">
          <div class="board" id="board" aria-label="board">
            <svg class="pathsvg" id="pathsvg" viewBox="0 0 5 7" preserveAspectRatio="none"></svg>
          </div>
        </div>
        <div class="boardbar">
          <div class="btns"><button class="btn" id="b-refill"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="refill">원소 보충</span></button><button class="btn" id="b-reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg><span data-i18n="reset">판 초기화</span></button></div>
        </div>
      </div>
    </section>

    <aside class="colC">
      <div class="card ctl">
        <div class="dial dial-t">
          <div class="dhead"><span class="dlab"><svg class="thermo" viewBox="0 0 12 24" aria-hidden="true"><rect x="3.5" y="1" width="5" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="19" r="4" fill="currentColor"/><rect id="thermo-fill" x="5" y="6" width="2" height="12" fill="currentColor"/></svg><span data-i18n="temp">온도</span></span><span class="dnow"><b id="tv">25.0°C</b><small id="tk">298 K</small></span></div>
          <div class="dset"><span data-i18n="set">설정</span><output id="tset-o">25 °C</output></div>
          <input type="range" id="tset" min="1301" max="3249" step="1" value="2474" aria-label="temperature">
          <div class="scale" id="tscale"></div>
          <div class="chiprow" id="tpre"></div>
        </div>
        <div class="dial dial-p">
          <div class="dhead"><span class="dlab"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0M12 15l4-5"/><circle cx="12" cy="15" r="1.4"/></svg><span data-i18n="pres">압력</span></span><span class="dnow"><b id="pv">1.00 atm</b><small id="pgpa"></small></span></div>
          <div class="dset"><span data-i18n="set">설정</span><output id="pset-o">1 atm</output></div>
          <input type="range" id="pset" min="-200" max="300" step="1" value="0" aria-label="pressure">
          <div class="scale" id="pscale"></div>
          <div class="chiprow" id="ppre"></div>
        </div>
        <div class="uvrow">
          <button class="uvbtn" id="b-uv" aria-pressed="false" aria-label="UV"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><b>UV</b><span class="uvs" id="uv-s">OFF</span></button>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="card logcard" id="logcard">
        <p class="eyebrow" data-i18n="log">반응 기록</p>
        <div id="log"></div>
        <div class="logscroll"><ul class="hist" id="hist"></ul>
        <div class="rxstats" id="rxstats"></div></div>
      </div>
    </aside>
  </div>

  <div class="xview" id="view-electro" hidden>
    <section class="card ec-stage">
      <div class="xhead"><div><p class="eyebrow" data-i18n="electro">전기화학 실험대</p><h2 class="xtitle" id="ec-title"></h2></div><div class="seg2" role="group"><button id="ec-cell" aria-pressed="true" data-i18n="cell">전지</button><button id="ec-lys" aria-pressed="false" data-i18n="lys">전기분해</button></div></div>
      <div class="svgbox"><svg id="ec-svg" class="ec-svg" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="cell"></svg></div>
      <div class="ec-ctl"><div class="half" id="half-L"></div><div class="half" id="half-R"></div></div>
      <div class="ec-row">
        <div class="dial"><div class="dhead"><span class="dlab" data-i18n="soltemp">용액 온도</span><output class="dval" id="ec-T-o">25 °C</output></div><input type="range" id="ec-T" min="0" max="100" step="1" value="25"></div>
        <div class="dial" id="ec-V-wrap"><div class="dhead"><span class="dlab" data-i18n="volt">외부 전압</span><output class="dval" id="ec-V-o">0.00 V</output></div><input type="range" id="ec-V" min="0" max="600" step="1" value="0"></div>
      </div>
    </section>
    <section class="xside">
      <div class="card readcard"><p class="eyebrow" data-i18n="read">측정값</p><div id="ec-out"></div><div class="series"><p class="sub-eyebrow" data-i18n="series">전기화학 서열 (표준 환원 전위)</p><svg id="ec-series" viewBox="0 0 400 112" preserveAspectRatio="none"></svg></div></div>
    </section>
  </div>

  <div class="xview" id="view-fusion" hidden>
    <section class="card fu-stage">
      <div class="xhead"><div><p class="eyebrow" data-i18n="fusion">핵융합로</p><h2 class="xtitle" id="fu-title"></h2></div><div class="seg2" id="fu-fuel" role="group"></div></div>
      <div class="fu-graph"><canvas id="fu-cv" aria-label="reactivity graph"></canvas></div>

const D={
H:'우주 질량의 약 74%를 차지하는 가장 가벼운 원소입니다. 1766년 헨리 캐번디시가 금속과 산의 반응에서 "가연성 공기"로 처음 분리했고, 라부아지에가 "물을 만드는 것(hydrogène)"이라는 이름을 붙였습니다. 원자 상태의 수소는 매우 불안정해서 두 원자가 만나면 436 kJ/mol의 열을 내며 H₂가 됩니다. 약 1만 K에서는 전자를 잃고 플라즈마가 됩니다.',
O3:'산소 원자 3개로 된 옅은 푸른색 기체입니다. 성층권에서는 자외선이 O₂를 산소 원자로 쪼개고, 그 원자가 O₂와 만나 오존이 됩니다(채프먼 메커니즘). 3O₂ → 2O₃는 ΔG > 0이라 열만으로는 절대 일어나지 않고, 자외선이나 방전(번개, 오존 발생기) 같은 에너지가 필요합니다. 반대로 오존은 가열하거나 촉매와 만나면 산소로 분해됩니다.',
O:'1774년 조지프 프리스틀리가 붉은 산화수은(HgO)을 렌즈로 가열해 얻었고, 셸레도 독립적으로 발견했습니다. 라부아지에는 연소가 플로지스톤의 방출이 아니라 산소와의 결합이라는 사실을 밝혀 근대 화학의 문을 열었습니다.',
N:'1772년 대니얼 러더퍼드가 "해로운 공기"로 분리했습니다. 공기의 78%를 차지하지만 N≡N 삼중결합(945 kJ/mol)이 매우 강해 반응성이 낮습니다. 이 결합을 끊어 암모니아를 만드는 일이 20세기 화학의 가장 큰 과제 중 하나였습니다.',
C:'탄소는 모든 생명체의 뼈대가 되는 원소입니다. 상온·상압에서 가장 안정한 형태는 흑연이고, 다이아몬드는 약 1.6 GPa 이상의 압력에서만 열역학적으로 더 안정합니다. 1772년 라부아지에는 다이아몬드를 태우면 이산화탄소만 남는다는 것을 보여 다이아몬드가 탄소임을 증명했습니다.',
Cl:'1774년 셸레가 이산화망가니즈와 염산으로 처음 만들었고, 1810년 험프리 데이비가 원소임을 밝혔습니다. 황록색의 독성 기체로, 지금은 수돗물 소독과 PVC 생산에 쓰입니다.',
He:'1868년 일식 때 태양 스펙트럼에서 먼저 발견되었습니다. 1기압에서는 절대영도 근처에서도 얼지 않으며, 이온화 에너지가 24.6 eV로 모든 원소 중 가장 커서 가장 늦게 플라즈마가 됩니다.',
Na:'1807년 험프리 데이비가 녹인 수산화나트륨을 전기분해해 처음 얻었습니다. 칼로 자를 수 있을 만큼 무르고, 물에 넣으면 수소를 내며 격렬하게 반응합니다. 이온화 에너지가 작아 비교적 낮은 온도에서 이온화됩니다.',
Mg:'공기 중에서 태우면 눈부신 흰 빛을 내 초기 사진 플래시에 쓰였습니다. 생성물인 산화마그네슘은 녹는점이 2852 °C로 매우 높아 내화재로 쓰입니다.',
Al:'지각에 가장 많은 금속이지만 1886년 홀-에루 전해법 이전에는 금보다 비쌌습니다. 1893년 한스 골트슈미트가 개발한 테르밋 반응은 산화철을 알루미늄으로 환원하며 2500 °C가 넘는 열을 냅니다.',
S:'고대부터 알려진 노란 원소입니다. 95.5 °C에서 사방정계(α)에서 단사정계(β)로 결정 구조가 바뀌는 대표적인 동질이상 전이를 보여 줍니다.',
Ca:'1808년 데이비가 분리했습니다. 석회석(CaCO₃) → 생석회(CaO) → 소석회(Ca(OH)₂) → 다시 석회석으로 이어지는 "석회 순환"은 수천 년 동안 건축의 기본이었습니다.',
Fe:'철은 온도에 따라 결정 구조가 바뀝니다. 912 °C에서 체심입방(α)이 면심입방(γ, 오스테나이트)으로, 1394 °C에서 다시 체심입방(δ)이 됩니다. 약 13 GPa 이상에서는 육방밀집(ε) 구조가 되는데, 지구 내핵의 철이 이 상태로 추정됩니다. 하버-보슈 공정의 촉매이기도 합니다.',
Cu:'인류가 처음 쓴 금속 중 하나입니다. 구리 이온(Cu²⁺)은 물에서 푸른색을 띠고, 암모니아와 만나면 짙은 남색 착이온을 만듭니다. 메탄올 합성 촉매로도 쓰입니다.',
Zn:'구리보다 이온화 경향이 커서 황산구리 용액에 넣으면 구리를 석출시킵니다. 1800년 볼타 전지의 전극으로 쓰였습니다.',
Ag:'모든 금속 중 전기·열 전도도가 가장 높습니다. 구리선을 질산은 용액에 넣으면 은 결정이 나뭇가지처럼 자라는 "은나무"가 생깁니다.',
Hg:'상온에서 액체인 유일한 금속입니다. 프리스틀리는 산화수은을 가열해 수은과 산소로 분해했고, 이 실험이 산소 발견으로 이어졌습니다.',
Pt:'1823년 되베라이너는 백금 스펀지에 수소를 뿜으면 저절로 불이 붙는 "되베라이너 램프"를 만들었습니다. 백금은 활성화 에너지를 낮추는 대표적인 촉매로, 자동차 배기가스 정화 장치에도 쓰입니다.',
H2:'가장 가벼운 기체입니다. 산소와의 반응은 열역학적으로 매우 유리하지만(ΔG° = −457 kJ) 활성화 에너지 때문에 상온에서는 거의 일어나지 않습니다. 점화하거나 백금 촉매를 쓰면 폭발적으로 반응합니다. 400 GPa가 넘는 압력에서는 금속 수소가 될 것으로 예측됩니다.',
O2:'공기의 21%를 차지합니다. 액체 산소는 옅은 푸른색이고 자석에 끌립니다(상자성). 약 4000 K 이상에서는 산소 원자로 해리됩니다.',
N2:'공기의 78%를 차지합니다. 110 GPa 이상, 약 2000 K에서는 N≡N 결합이 끊기고 단일결합 그물 구조인 "중합 질소(cg-N)"가 됩니다.',
Cl2:'황록색 기체입니다. 수소와 섞인 채로 빛을 쬐거나 가열하면 연쇄 반응으로 폭발하며 염화수소가 생깁니다.',
H2O:'물은 압력을 높이면 녹는점이 내려가는 드문 물질입니다(얼음 Ih가 물보다 가볍기 때문). 하지만 0.2 GPa 이상에서는 얼음 III·V·VI이, 2.2 GPa 이상에서는 얼음 VII이 생기고, 얼음 VII은 100 °C가 넘어도 녹지 않습니다. 374 °C·218 atm을 넘으면 액체와 기체의 구분이 사라진 초임계수가 됩니다.',
H2O2:'1818년 테나르가 처음 만들었습니다. 물과 산소로 분해되려는 경향이 크지만 느리며, 이산화망가니즈(MnO₂) 촉매를 넣으면 거품을 내며 빠르게 분해됩니다.',
NH3:'암모니아라는 이름은 고대 이집트 아문 신전 근처에서 염화암모늄이 채취된 데서 유래했습니다. 1774년 프리스틀리가 "알칼리성 공기"로 분리했고, 1785년 베르톨레가 질소와 수소로 이루어졌음을 밝혔습니다. 20세기 초 하버와 보슈는 고온·고압과 철 촉매로 공기 중 질소를 암모니아로 바꾸는 방법을 개발해 합성 비료의 시대를 열었습니다.',
CH4:'천연가스의 주성분입니다. 1776년 볼타가 늪에서 나오는 기포를 모아 발견했습니다. 고온에서는 탄소와 수소로 열분해되고, 전기 아크나 플라즈마 속에서는 아세틸렌이 됩니다.',

function waterPh(T,P){
  const TK=T+273.15, Pg=P/GPA;
  if(P<0.006037){ const Ts=1/(1/273.16-RG*Math.log(P/0.006037)/51000); return TK<Ts?{ph:'s',poly:'얼음 Ih'}:{ph:'g'}; }
  let Tm,poly;
  if(Pg<0.21){Tm=-22*Pg/0.21;poly='얼음 Ih';}
  else if(Pg<0.35){Tm=-22+5*(Pg-0.21)/0.14;poly='얼음 III';}
  else if(Pg<0.63){Tm=-17+17*(Pg-0.35)/0.28;poly='얼음 V';}
  else if(Pg<2.2){Tm=81.6*(Pg-0.63)/1.57;poly='얼음 VI';}
  else {Tm=Math.min(2500,81.6+44*(Pg-2.2));poly=Pg>62?'얼음 X':'얼음 VII';}
  if(T<Tm) return {ph:'s',poly};
  if(T>373.9&&P>217.7) return {ph:'sc',poly:'초임계수'};
  const Tb=P>=217.7?Infinity:1/(1/373.15-((1/373.15-1/647.05)/Math.log(217.7))*Math.log(P));
  return TK>=Tb?{ph:'g'}:{ph:'l'};
}
function bpAt(s,P){
  if(s.bp==null) return Infinity;
  let T0=s.bp+273.15,P0=1;
  if(s.triple){T0=s.triple[0]+273.15;P0=s.triple[1];}
  if(s.Tc!=null){ const Tc=s.Tc+273.15; if(P>=s.Pc) return Infinity; const a=(1/T0-1/Tc)/Math.log(s.Pc/P0); return 1/(1/T0-a*Math.log(P/P0)); }
  const d=1-0.0945*Math.log(P/P0); return d<=0.05?Infinity:T0/d;
}
function polyOf(s,T,P,ph){
  if(ph!=='s') return ''; const Pg=P/GPA;
  switch(s.id){
    case 'C': return '흑연'; case 'Cdia': return '다이아몬드';
    case 'Fe': return T>1394?'δ-철 (BCC)':T>912?'γ-철 (FCC)':Pg>13?'ε-철 (HCP)':'α-철 (BCC)';

function autoTick(){

function fmt(f){ let o='',sub=false; for(let i=0;i<f.length;i++){ const c=f[i];
  if(c==='^'){ let j=i+1,ch=''; while(j<f.length&&/[0-9+\-]/.test(f[j])){ch+=f[j];j++;} if(sub){o+='</sub>';sub=false;} o+='<sup>'+ch.replace('-','−')+'</sup>'; i=j-1; continue; }
  if(/[0-9]/.test(c)&&(sub||(i>0&&/[A-Za-z)\]]/.test(f[i-1])))){ if(!sub){o+='<sub>';sub=true;} o+=c; continue; }
  if(sub){o+='</sub>';sub=false;} o+=c; } if(sub) o+='</sub>'; return o; }
const SUBD='₀₁₂₃₄₅₆₇₈₉', SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
function plainF(f){ return fmt(f).replace(/<sub>(.*?)<\/sub>/g,(m,a)=>a.replace(/\d/g,d=>SUBD[d])).replace(/<sup>(.*?)<\/sup>/g,(m,a)=>a.replace(/\d/g,d=>SUPD[d]).replace('+','⁺').replace('−','⁻')); }
const sg=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function fmtT(x){ return Math.abs(x)>=1000?Math.round(x).toLocaleString():Math.abs(x)>=100?x.toFixed(0):x.toFixed(1); }
function fmtK(K){ if(!isFinite(K)) return '∞'; if(K===0) return '0'; const e=Math.floor(Math.log10(K)); if(Math.abs(e)<3) return K.toPrecision(3); const m=K/Math.pow(10,e); return m.toFixed(1)+'×10'+String(e).replace('-','⁻').replace(/\d/g,d=>SUPD[d]); }
function fmtP(P){ if(P>=1000) return (P/GPA).toPrecision(P/GPA>=10?3:2)+' GPa'; if(P<0.1) return P.toPrecision(2)+' atm'; return P.toPrecision(3)+' atm'; }
function eqHTML(r){ const b=B(); const side=m=>Object.entries(m).map(([id,c])=>{const s=SP[id]; const ph=phaseOf(s,b.T,b.P).ph; return `${c>1?c+' ':''}${fmt(s.f)}<small>(${PHS[ph]})</small>`;}).join(' + ');
  return side(r.re)+(r.rev||r.isRev?' ⇌ ':' → ')+side(r.pr); }
function eqPlain(r){ const side=m=>Object.entries(m).map(([id,c])=>(c>1?c+' ':'')+plainF(SP[id].f)+(SP[id].k==='aq'?'(aq)':'')).join(' + '); return side(r.re)+' → '+side(r.pr); }

  let h='<span class="gauge">'; if(mp!=null&&mp>-280) h+=`<i class="tk" style="left:${gaugePos(mp+273.15).toFixed(1)}%"></i>`;
  if(bp!=null) h+=`<i class="tk" style="left:${gaugePos(bp+273.15).toFixed(1)}%"></i>`;
  return h+`<b class="dot" style="left:${gaugePos(b.T+273.15).toFixed(0)}%"></b></span>`; }
function tileInner(sp){

  const tf=s.tf||s.f; const vis=tf.replace(/[\^\(\)\[\]]/g,'').replace(/[+\-]$/,'').length; const lc=vis>6?'xs':vis>4?'s':vis>2?'m':'';
  const top=s.Z?`<span class="z">${s.Z}</span>`:gaugeHTML(s);
  const nm=(s.k==='aq'&&pi.frozen)?L('얼어붙은 용액','Frozen'):(polyName(pi.poly)||spName(sp));
  const tint=s.col||(s.k==='aq'?'var(--aq)':null);
  const cls=`tile k-${s.k} ph-${ph}${s.col?' colored':''}${pi.frozen?' frozen':''}`;
  const html=`<div class="face">${tint?`<span class="tint" style="--tint:${tint}"></span>`:''}${top}${s.cat?`<span class="catb">${L('촉매','cat.')}</span>`:''}<span class="sym ${lc}">${fmt(tf)}${ph==='plasma'?'<sup>+</sup>':''}</span><span class="nm">${nm}</span><span class="phb">${PHS[ph]}</span></div>`;

    const ti=tileInner(t.sp); const cls=ti.cls+(sel&&sel.has(i)?' sel':'')+(t.born?' born':'');
    if(el._k!==ti.key){ el.innerHTML=ti.html; el._k=ti.key; el.setAttribute('aria-label',SP[t.sp].n); }
    if(el.className!==cls) el.className=cls;

  $('#tpre').innerHTML=TPRE.map(([l,k],i)=>`<button data-i="${i}" class="${on(k,b.Tset+273.15)?'on':''}" ${k>LM.Kmax+1||k<LM.Kmin?'disabled':''}>${l}</button>`).join('');
  $('#ppre').innerHTML=PPRE.map(([l,p],i)=>`<button data-i="${i}" class="${on(p,b.P)?'on':''}" ${p>LM.Pmax*1.01||p<LM.Pmin?'disabled':''}>${l}</button>`).join(''); }
$('#tpre').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; if(st.mode==='stage'&&st.energy<=0) return; B().Tset=TPRE[b.dataset.i][1]-273.15; syncSliders(); renderHUD(); });
$('#ppre').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; if(st.mode==='stage'&&st.energy<=0) return; B().P=PPRE[b.dataset.i][1]; syncSliders(); renderHUD(); });

function placeSp(sp){
  const g=G(), s=SP[sp]; const empt=[]; for(let i=0;i<N;i++) if(!g[i]) empt.push(i);
  if(!empt.length){ pushLog({ok:false,ms:{[sp]:1},msg:L('빈칸이 없어요. 타일을 한 번 눌러 정보 창에서 제거하세요.','No empty cell. Tap a tile and remove it from its card.')}); toast(L('빈칸 없음','Board full'),'var(--muted)',true); return; }
  const gas=!anchored(s)&&gasLike(phNow(s).ph); const i=gas?empt[0]:empt[empt.length-1];
  g[i]=newTile(sp); floatAt(cellCenter([i]),'+ '+s.n,'var(--accent)',true); render(); save();
}
function renderShop(){
  const lab=st.mode==='lab';
  $('#shopf').innerHTML=Object.keys(SHOPCAT).map(k=>`<button aria-pressed="${k===shopCat}" data-k="${k}">${L(k==='산염기'?'산·염기':k,SHOPEN[k])}</button>`).join('');
  const items=SHOP.filter(([id])=>SHOPCAT[shopCat].includes(id));
  $('#shop').innerHTML=items.map(([id,c])=>`<button class="shopitem" data-id="${id}" data-c="${c}" ${!lab&&st.coins<c?'disabled':''}><span class="sf${(SP[id].tf||SP[id].f).replace(/[^A-Za-z0-9]/g,'').length>6?' long':''}">${fmt(SP[id].tf||SP[id].f)}</span><span class="sn">${spName(id)}</span><span class="sc">${lab?L('무료','free'):c+'◆'}</span></button>`).join('');
  $('#shop-note').textContent=lab?L('누르면 빈칸에 놓여요','Tap to place'):'◆ '+st.coins;
}
$('#shopf').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; shopCat=b.dataset.k; renderShop(); });
$('#shop').addEventListener('click',e=>{ const b=e.target.closest('.shopitem'); if(!b||b.disabled) return; const c=+b.dataset.c;
  if(st.mode==='stage'){ if(st.coins<c) return; st.sg.bought=1; if(G().every(x=>x)) { placeSp(b.dataset.id); return; } st.coins-=c; } placeSp(b.dataset.id); renderShop(); });

$('#b-refill').onclick=()=>{ const g=G(); let n=0;
  const el=st.mode==='stage'?STAGES[st.stage].el:{H:5,O:3,N:2,C:2,Cl:1};
  for(let i=0;i<N;i++) if(!g[i]){ if(st.mode==='stage'){ if(st.supply<=0) break; st.supply--; } g[i]=newTile(pickEl(el)); n++; }

function setMode(m){
  if(m==='electro'||m==='fusion') st.view=m; else { st.view='game'; st.mode=m; }
  ['stage','lab','electro','fusion'].forEach(k=>$('#m-'+k).setAttribute('aria-pressed',st.view==='game'?st.mode===k:st.view===k));
  $('#view-game').hidden=st.view!=='game'; $('#view-electro').hidden=st.view!=='electro'; $('#view-fusion').hidden=st.view!=='fusion';
  if(st.view==='game'){ tileEls.forEach(e=>e.remove()); tileEls.clear(); $('#goals')._h=''; syncSliders(); syncUV(); render(); renderShop(); }
  else if(st.view==='electro') ecRender(); else fuRender();
  if(st.view!=='fusion') fuVizStop();
  save(); }

const HELP_MD="### 조작\n- **잇기** — 이웃한 타일(대각선 포함)을 이어 그어요. 고른 타일 묶음이 균형 반응식의 계수와 정확히 같아야 반응해요. 예: `H₂` 2개 + `O₂` 1개\n- **정보** — 타일을 한 번 누르면 물질 카드(성질, 위험성, 백과사전, 관련 반응)가 열려요.\n- **움직임** — 원자·원소 타일은 판에 고정돼요. 만들어진 물질은 기체면 떠오르고, 고체·액체면 가라앉아요.\n- **자동 반응** — 이웃한 물질끼리의 평형, 용해, 열분해, 고온 해리, 증발은 조건이 맞으면 저절로 일어나요.\n\n### 반응이 일어나는 조건\n| 판정 | 기준 | 바꾸는 방법 |\n|---|---|---|\n| 자발성 | ΔG < 0 | 온도, 압력, 농도, UV |\n| 속도 | 아레니우스 식 | 가열, 촉매 타일 |\n| 공간 | 생성물이 들어갈 빈칸 | 타일 제거 |\n| 상태 | 플라즈마·얼어붙은 용액은 반응 불가 | 온도 |\n\n> ΔG = ΔH − TΔS + Δn(기체)·RT ln P + PΔV\n\n- ΔH와 ΔS의 부호가 같으면 온도에 따라 자발성이 뒤집혀요. 예: `CaCO₃ 분해`, `2NO₂ ⇌ N₂O₄`, `NH₄Cl 분해`\n- 기체 분자 수가 줄어드는 반응(Δn < 0)은 고압에서 유리해요. 예: 하버 공정, 메탄올 합성\n- 촉매(Pt, Fe, Cu, MnO₂, V₂O₅)는 속도만 높이고 ΔG는 바꾸지 않아요.\n\n### 에너지와 온도\n- 반응로의 열용량은 **10 kJ/°C**예요. 발열 반응은 온도를 올리고, 흡열 반응은 내려요.\n- 온도는 몇 초에 걸쳐 설정값으로 돌아가요. 발열 반응을 연쇄시키면 가열 없이도 고온 반응을 일으킬 수 있어요.\n- **UV 램프**는 빛 에너지를 넣어 ΔG > 0 반응(`3O₂ → 2O₃`)을 일으키고, 빛으로 시작하는 연쇄 반응(`H₂ + Cl₂`)의 온도 문턱을 없애요.\n- 스테이지 모드에서는 가열·가압·램프가 에너지를 소모해요. 상온·상압에서 다시 충전돼요.\n\n### 상(phase)\n| 상태 | 표시 | 기준 |\n|---|---|---|\n| 고체 · 액체 · 기체 | s · l · g | 녹는점, 압력으로 보정한 끓는점 |\n| 초임계 유체 | sc | 임계 온도와 임계 압력을 모두 넘음 |\n| 수용액 | aq | 물이 액체일 때만 유지 |\n| 플라즈마 | pl | 약 735 K × 이온화 에너지(eV) |\n\n- **고압 상**: 흑연 → 다이아몬드, 얼음 Ih·III·V·VI·VII·X, 철 α·γ·δ·ε, NaCl B1 → B2, 금속 수소, 중합 질소\n- 분자는 이온화되기 전, 약 4000 °C부터 원자로 해리돼요.\n\n### 수용액\n- 액체 물 옆의 물질은 용해 평형상수 K > 10⁻⁴이면 녹아요. `AgCl`, `PbI₂`, `CaCO₃`, `Cu(OH)₂`는 녹지 않아요.\n- 중화, 앙금 생성, 착이온 형성, 금속 치환 반응을 지원해요.\n- 착이온 타일은 짧은 이온식으로 표시하고, 전체 화학식은 정보 카드에서 보여 줘요.\n\n### 반응 속도와 농도\n- 자동 반응의 속도는 아레니우스 식 k ∝ e^(−Ea/RT)를 따라요. 기준 온도보다 조금 낮아도 느리게 일어나고, 높을수록 빨라져요. 직접 이어 그을 때는 기준 온도 이상이어야 해요.\n- **르샤틀리에 원리** — 반응하는 용액 주변에 같은 용액 타일을 더 두면 농도가 올라간 것으로 계산해 ΔG에 −νRT ln a를 더해요. 예: 분홍 코발트 용액 옆에 염산이나 소금물을 두면 Cl⁻ 농도가 올라가 상온에서도 파랗게 변해요.\n- 산화·환원 반응은 반응 기록에 전지 전압(Ecell = −ΔG/nF)도 보여 줘요.\n\n### 전기화학 실험대\n- 두 반쪽 전지를 고르고 이온 농도와 온도를 바꾸면 네른스트 식으로 전압을 계산해요.\n\n> E = E° − (RT/nF) ln Q\n\n- **전지** 모드: 전위가 낮은 쪽이 산화 전극(−), 높은 쪽이 환원 전극(+)이에요. ΔG = −nFE.\n- **전기분해** 모드: 외부 전압이 기전력 + 과전압보다 크면 반대 방향 반응이 강제로 일어나요. 기체가 생기는 전극은 과전압 약 0.5 V를 더해요.\n\n### 핵융합로\n- 연료, 이온 온도, 밀도, 가둠 시간으로 1 m³당 에너지 수지를 계산해요. 반응도 ⟨σv⟩는 실제 측정값을 보간한 값이에요.\n\n> Q = P핵융합 / (P제동복사 + P열전도 − P하전입자가열)\n\n- 하전 입자 가열이 모든 손실보다 크면 **점화**예요. D–T는 에너지의 20%만 알파 입자로 남고, 나머지는 중성자가 가져가요.\n- p–¹¹B처럼 전하가 큰 연료는 제동 복사가 커서 열평형 플라즈마로는 손익분기가 매우 어려워요.\n\n### 단순화한 부분\n- ΔH와 ΔS는 온도에 따라 변하지 않는다고 가정했어요.\n- 반응판의 농도는 표준 상태(1 M, 1 atm)를 기준으로, 주변 타일 수로만 보정해요.\n- 핵융합로는 0차원 모델이에요. 플라즈마 모양, 불안정성, 상대론 효과는 넣지 않았어요.\n- 타일 하나는 반응식의 계수 1에 해당하는 양이에요.\n";
const HELP_MD_EN="### Controls\n- **Join** — drag across neighbouring tiles (diagonals too). The tiles you pick must match the coefficients of a balanced equation exactly. Example: 2 × `H₂` + 1 × `O₂`\n- **Info** — tap a tile once to open its card (properties, hazards, encyclopedia, related reactions).\n- **Movement** — atom and element tiles are fixed to the board. Products move by phase: gases rise, solids and liquids sink.\n- **Automatic reactions** — equilibria between neighbours, dissolving, thermal decomposition, high-temperature dissociation and evaporation happen by themselves when conditions allow.\n\n### When does a reaction happen?\n| Check | Rule | How to change it |\n|---|---|---|\n| Spontaneity | ΔG < 0 | Temperature, pressure, concentration, UV |\n| Rate | Arrhenius equation | Heat, catalyst tiles |\n| Space | Empty cells for the products | Remove tiles |\n| State | No reactions in plasma or frozen solutions | Temperature |\n\n> ΔG = ΔH − TΔS + Δn(gas)·RT ln P + PΔV\n\n- When ΔH and ΔS have the same sign, spontaneity flips with temperature. Examples: `CaCO₃ decomposition`, `2NO₂ ⇌ N₂O₄`, `NH₄Cl decomposition`\n- Reactions that reduce the number of gas molecules (Δn < 0) are favoured by high pressure. Examples: Haber process, methanol synthesis\n- Catalysts (Pt, Fe, Cu, MnO₂, V₂O₅) only speed reactions up; they do not change ΔG.\n\n### Energy and temperature\n- The reactor's heat capacity is **10 kJ/°C**. Exothermic reactions heat it, endothermic ones cool it.\n- The temperature drifts back to the set point over a few seconds. Chaining exothermic reactions can trigger high-temperature reactions without a heater.\n- The **UV lamp** supplies light energy to drive ΔG > 0 reactions (`3O₂ → 2O₃`) and removes the temperature threshold of light-initiated chain reactions (`H₂ + Cl₂`).\n- In stage mode, heating, pressurising and the lamp use energy, which recharges at room temperature and pressure.\n\n### Reaction rate and concentration\n- Automatic reactions follow the Arrhenius equation k ∝ e^(−Ea/RT): slightly below the threshold they still happen slowly, and above it they speed up. Reactions you draw yourself need the threshold temperature.\n- **Le Chatelier's principle** — extra tiles of the same solution around a reaction count as higher concentration, adding −νRT ln a to ΔG. Example: hydrochloric acid or brine next to pink cobalt raises Cl⁻ and turns it blue even at room temperature.\n- Redox reactions also show the cell voltage Ecell = −ΔG/nF in the log.\n\n### Phases\n| State | Label | Rule |\n|---|---|---|\n| Solid · liquid · gas | s · l · g | Melting point, boiling point corrected for pressure |\n| Supercritical fluid | sc | Above both critical temperature and pressure |\n| Aqueous | aq | Only while water is liquid |\n| Plasma | pl | About 735 K × ionisation energy (eV) |\n\n- **High-pressure phases**: graphite → diamond, ice Ih · III · V · VI · VII · X, iron α · γ · δ · ε, NaCl B1 → B2, metallic hydrogen, polymeric nitrogen\n- Molecules split into atoms from about 4000 °C, before they ionise.\n\n### Solutions\n- A substance next to liquid water dissolves if its dissolution constant K > 10⁻⁴. `AgCl`, `PbI₂`, `CaCO₃` and `Cu(OH)₂` do not dissolve.\n- Neutralisation, precipitation, complex formation and metal displacement are supported.\n- Complex-ion tiles show a short ion formula; the full formula is on the info card.\n\n### Electrochemistry bench\n- Pick two half-cells and set ion concentrations and temperature; the voltage comes from the Nernst equation.\n\n> E = E° − (RT/nF) ln Q\n\n- **Cell** mode: the electrode with the lower potential is the anode (−, oxidation), the higher one the cathode (+, reduction). ΔG = −nFE.\n- **Electrolysis** mode: an applied voltage above the EMF plus overpotential forces the reverse reaction. Gas-producing electrodes need about 0.5 V of overpotential.\n- Gas and ion-pair electrodes (H₂, O₂, Cl₂, I₂, Fe³⁺/Fe²⁺) use inert platinum.\n\n### Fusion reactor\n- Pick a fuel, ion temperature, density and confinement time to compute the power balance per m³. Reactivity ⟨σv⟩ is interpolated from measured data.\n\n> Q = P(fusion) / (P(bremsstrahlung) + P(conduction) − P(charged-particle heating))\n\n- When charged-particle heating exceeds all losses, the plasma is **ignited**. In D–T only 20% of the energy stays as alpha particles; neutrons carry the rest.\n- High-charge fuels such as p–¹¹B radiate so much bremsstrahlung that thermal breakeven is extremely hard.\n\n### Simplifications\n- ΔH and ΔS are assumed independent of temperature.\n- Board concentrations start from standard states (1 M, 1 atm) and are adjusted only by neighbouring tiles.\n- One tile equals a coefficient of 1 in the equation.\n- The fusion reactor is a zero-dimensional model: no plasma shape, instabilities or relativistic effects.\n";
function mdInline(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>'); }
function md(src){ const L=src.split('\n'); let o='',i=0;
  while(i<L.length){ const l=L[i];
    if(!l.trim()){i++;continue;}
    if(l.startsWith('### ')){ o+=`<h3>${mdInline(l.slice(4))}</h3>`; i++; continue; }
    if(l.startsWith('> ')){ o+=`<blockquote>${mdInline(l.slice(2))}</blockquote>`; i++; continue; }
    if(l.startsWith('|')){ const rows=[]; while(i<L.length&&L[i].startsWith('|')){ rows.push(L[i]); i++; }
      const cells=r=>r.slice(1,-1).split('|').map(c=>mdInline(c.trim()));
      o+='<div class="tbl"><table><thead><tr>'+cells(rows[0]).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'; continue; }
    if(l.startsWith('- ')){ o+='<ul>'; while(i<L.length&&L[i].startsWith('- ')){ o+=`<li>${mdInline(L[i].slice(2))}</li>`; i++; } o+='</ul>'; continue; }
    let p=[]; while(i<L.length&&L[i].trim()&&!/^(### |> |\||- )/.test(L[i])){ p.push(L[i]); i++; } o+=`<p>${mdInline(p.join(' '))}</p>`; }
  return o; }

function ecCalc(){
  const e=st.ec, TK=e.T+273.15, L=HC[e.L], R=HC[e.R];
  const Eh=(h,c)=>h.E+h.s*RG*TK/(h.ne*FAR)*h.nu*Math.log(c);
  const EL=Eh(L,e.cL), ER=Eh(R,e.cR);

  let cat=ER>=EL?'R':'L'; if(Math.abs(ER-EL)<1e-6) cat='R';
  const an=cat==='R'?'L':'R';

 ['halogen','할로젠 서열','Cl₂ → Br₂ → I₂ 치환을 모두','Halogen ladder','Do both halogen displacements',()=>!!st.found.rx.cl2_kbr&&!!st.found.rx.br2_ki]
];
function checkLab(){ st.found.lab=st.found.lab||{}; const b=B(); if(b.T>=1000&&b.Tset<=100) st.found.selfheat=1;
  LBQ.forEach(q=>{ if(!st.found.lab[q[0]]&&q[5]()){ st.found.lab[q[0]]=1; achieve(q[0],L(q[1],q[3])); } }); }
const QI={trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20h7M10 17h4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};
let qTab=null;
function questItems(tab){
  if(tab==='stage'){ const cl=st.cleared||{}, fs=st.found.stg||{}; const ex=[['pstage_perfect','완벽한 스테이지','한 스테이지에서 목표 3개 모두 달성'],['rich','부자 연구소','코인 500 보유'],['frugal','절약가','시약을 사지 않고 스테이지 클리어'],['allclear','그랜드 마스터','모든 스테이지 클리어']].map(([k,t,d])=>({ok:!!fs[k],t:L(t,QEN[k][0]),d:L(d,QEN[k][1])})); return ex.concat(STAGES.map((S_,i)=>({ok:!!cl[i],t:`${L('스테이지','Stage')} ${i+1} · ${L(S_.name,STEN[i][0])}`,d:L('목표: ','Goal: ')+S_.goals.filter(g=>g.main).map(g=>g.s?(g.s==='Cdia'?spName('Cdia'):plainF(SP[g.s].tf||SP[g.s].f)):g.r?rxName(RXI[g.r]):(g.p==='plasma'?L('플라즈마','plasma'):polyName(g.p))).join('')}))); }
  if(tab==='lab'){ const f=st.found.lab||{}; return LBQ.map(q=>({ok:!!f[q[0]],t:L(q[1],q[3]),d:L(q[2],q[4]),pr:q[6]?q[6]():null})); }
  const arr=tab==='electro'?ECQ:FUQ, f=(tab==='electro'?st.found.ec:st.found.fu)||{};
  return arr.map(([k,t,d])=>{ if(st.lang==='en'&&QEN[k]) [t,d]=QEN[k]; return {ok:!!f[k],t,d}; });
}
function openQuests(tab){
  qTab=tab||(st.view==='game'?st.mode:st.view);
  const tabs=[['stage',I18N.stage],['lab',I18N.lab],['electro',I18N.electro],['fusion',I18N.fusion]];
  const items=questItems(qTab), done=items.filter(x=>x.ok).length;
  const all=['stage','lab','electro','fusion'].map(questItems).flat(), allDone=all.filter(x=>x.ok).length;
  openSheet(`<div class="sheethead"><h2>${L('도전 과제','Challenges')}</h2><button class="x" aria-label="close" id="x1">✕</button></div>
   <div class="qtabs" role="tablist">${tabs.map(([k,v])=>`<button role="tab" data-q="${k}" aria-selected="${k===qTab}">${v[st.lang==='en'?1:0]}<span>${questItems(k).filter(x=>x.ok).length}/${questItems(k).length}</span></button>`).join('')}</div>
   <div class="qhero"><div><b>${done}</b><span>/ ${items.length}</span></div><div class="qbar"><i style="width:${(done/items.length*100).toFixed(1)}%"></i></div><small>${L('전체','Overall')} ${allDone}/${all.length}</small></div>
   <div class="qcards">${items.map(x=>`<div class="qc${x.ok?' ok':''}"><span class="qic"><svg viewBox="0 0 24 24">${x.ok?QI.trophy:QI.lock}</svg></span><div class="qct"><b>${x.t}</b><small>${x.d}</small>${x.pr&&!x.ok?`<div class="qmini"><i style="width:${Math.min(100,x.pr[0]/x.pr[1]*100).toFixed(0)}%"></i></div><small class="mono">${Math.min(x.pr[0],x.pr[1])}/${x.pr[1]}</small>`:''}</div><span class="qst">${x.ok?L('달성','Done'):L('진행 중','Open')}</span></div>`).join('')}</div>`);
  $('#x1').onclick=closeSheet; $('#sheet').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openQuests(b.dataset.q));
}
$('#b-quest').onclick=()=>openQuests();
/* ───────────── 핵융합 시각화 ───────────── */
let fuAnim=null, fuLast=0, fuAcc=0; const fuP=[], fuFx=[];
let fuVS={T:10,Pf:0,Q:0,ign:false,fuel:'DT'};
for(let i=0;i<70;i++) fuP.push({a:Math.random()*Math.PI*2,r:(Math.random()-.5)*0.5,v:.6+Math.random()*.8});
function fuVizStart(){ if(fuAnim) return; let rm=false; try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(_){} if(rm){ fuVizFrame(performance.now()); return; } const loop=t=>{ fuAnim=requestAnimationFrame(loop); fuVizFrame(t); }; fuAnim=requestAnimationFrame(loop); }
function fuVizStop(){ if(fuAnim) cancelAnimationFrame(fuAnim); fuAnim=null; }
function fuVizFrame(t){
  const cv=$('#fu-viz'); if(!cv||!cv.clientWidth) return; const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const dt=Math.min(0.05,(t-(fuLast||t))/1000); fuLast=t;
  const s=fuVS, lt=Math.log10(Math.max(1,s.T))/3, hue=((25-lt*95)+360)%360, heat=Math.max(0,Math.min(1,(Math.log10(Math.max(s.Pf,1))-1)/6));
  const cx=w/2, cy=h/2+2, RX=w*0.36, RY=h*0.30;
  x.clearRect(0,0,w,h);
  const bg=x.createRadialGradient(cx,cy,10,cx,cy,Math.max(w,h)*0.7); bg.addColorStop(0,'#141a33'); bg.addColorStop(1,'#05070e'); x.fillStyle=bg; x.fillRect(0,0,w,h);
  // vessel
  x.strokeStyle='rgba(160,175,210,.35)'; x.lineWidth=2; x.beginPath(); x.ellipse(cx,cy,RX*1.22,RY*1.28,0,0,7); x.stroke(); x.beginPath(); x.ellipse(cx,cy,RX*0.72,RY*0.62,0,0,7); x.stroke();
  // coils
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, c=Math.cos(a), sn=Math.sin(a); x.strokeStyle='rgba(205,150,90,.75)'; x.lineWidth=5; x.beginPath(); x.moveTo(cx+c*RX*0.66,cy+sn*RY*0.55); x.lineTo(cx+c*RX*1.3,cy+sn*RY*1.38); x.stroke(); }
  // plasma
  const pulse=s.ign?0.5+0.5*Math.sin(t/180):0;
  x.save(); x.globalCompositeOperation='lighter';
  for(let k=3;k>=1;k--){ x.strokeStyle=`hsla(${hue},95%,${55+heat*20+pulse*10}%,${(0.10+heat*0.25)/k})`; x.lineWidth=(10+heat*16)*k*0.9; x.beginPath(); x.ellipse(cx,cy,RX,RY,0,0,7); x.stroke(); }
  x.strokeStyle=`hsla(${hue},100%,${70+heat*25}%,${0.55+heat*0.4})`; x.lineWidth=3+heat*4; x.beginPath(); x.ellipse(cx,cy,RX,RY,0,0,7); x.stroke();
  // ions
  const sp=(0.5+lt*1.6);
  fuP.forEach(p=>{ p.a+=p.v*sp*dt; const rr=1+p.r*0.18; x.fillStyle=`hsla(${hue},100%,85%,.85)`; x.beginPath(); x.arc(cx+Math.cos(p.a)*RX*rr,cy+Math.sin(p.a)*RY*rr,1.3,0,7); x.fill(); });
  // fusion events
  const rate=Math.max(0,Math.min(45,(Math.log10(Math.max(s.Pf,1e-9))+0.5)*5)); fuAcc+=rate*dt;
  const neut=s.fuel==='DT'||s.fuel==='DD';
  while(fuAcc>=1){ fuAcc-=1; const p=fuP[(Math.random()*fuP.length)|0], rr=1+p.r*0.18, px=cx+Math.cos(p.a)*RX*rr, py=cy+Math.sin(p.a)*RY*rr;
    fuFx.push({k:'flash',x:px,y:py,t:0});
    if(neut){ const ang=Math.random()*Math.PI*2; fuFx.push({k:'n',x:px,y:py,vx:Math.cos(ang)*160,vy:Math.sin(ang)*160,t:0}); }
    fuFx.push({k:'a',a:p.a,r:p.r,t:0}); }
  for(let i=fuFx.length-1;i>=0;i--){ const f=fuFx[i]; f.t+=dt;
    if(f.k==='flash'){ const life=.35; if(f.t>life){fuFx.splice(i,1);continue;} const q=f.t/life; x.fillStyle=`rgba(255,255,255,${1-q})`; x.beginPath(); x.arc(f.x,f.y,2+q*10,0,7); x.fill(); }
    else if(f.k==='n'){ if(f.t>1.2){fuFx.splice(i,1);continue;} f.x+=f.vx*dt; f.y+=f.vy*dt; x.fillStyle=`rgba(190,205,235,${1-f.t/1.2})`; x.beginPath(); x.arc(f.x,f.y,1.8,0,7); x.fill(); }
    else { if(f.t>1.6){fuFx.splice(i,1);continue;} f.a+=2.2*sp*dt; const rr=1+f.r*0.18; x.fillStyle=`rgba(255,210,80,${1-f.t/1.6})`; x.beginPath(); x.arc(cx+Math.cos(f.a)*RX*rr,cy+Math.sin(f.a)*RY*rr,2.2,0,7); x.fill(); } }
  x.restore();
  // labels
  x.font='600 11px "IBM Plex Mono", monospace'; x.fillStyle='rgba(220,228,250,.85)'; x.textAlign='left';
  x.fillText(`${s.T.toPrecision(3)} keV`,10,18);
  x.textAlign='right'; x.fillStyle=s.ign?'#ff9df5':s.Q>=1?'#5fe0a0':'rgba(170,180,210,.8)';
  x.fillText(s.ign?'IGNITION':s.Q>=1?'BREAKEVEN':rate<0.5?L('반응 거의 없음','barely fusing'):'',w-10,18);
  x.textAlign='left'; x.fillStyle='rgba(170,180,210,.7)'; x.font='10px "IBM Plex Mono", monospace';
  x.fillText(neut?L('● 중성자  ● 알파','● neutron  ● alpha'):L('● 하전 입자','● charged products'),10,h-9);
}

function lawDraw(){
  const cv=$('#fu-law'); if(!cv||!cv.clientWidth) return; const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); const cs=getComputedStyle(document.documentElement), C=v=>cs.getPropertyValue(v).trim();
  const f=FUEL[st.fu.fuel], pl=46,pr=10,pt=20,pb=22, W=w-pl-pr, H=h-pt-pb, y0=18, y1=25;
  const X=T=>pl+Math.log10(T)/3*W, Y=v=>pt+(1-(Math.log10(v)-y0)/(y1-y0))*H;
  x.font='11px "IBM Plex Mono", monospace'; x.strokeStyle=C('--line'); x.fillStyle=C('--muted'); x.lineWidth=1;
  for(let e=y0;e<=y1;e+=2){ const y=Y(Math.pow(10,e)); x.beginPath(); x.moveTo(pl,y); x.lineTo(w-pr,y); x.stroke(); x.fillText('1e'+e,4,y+3); }
  [1,10,100,1000].forEach(T=>{ const xx=X(T); x.beginPath(); x.moveTo(xx,pt); x.lineTo(xx,h-pb); x.stroke(); x.fillText(T+'',Math.min(xx-6,w-pr-26),h-6); });
  const curve=(q)=>{ x.beginPath(); let first=true; for(let i=0;i<=90;i++){ const T=Math.pow(10,i/30), sv=svAt(f,T), EJ=f.E*1.602e-13, k=f.same?0.5:0.25, pf=k*sv*EJ, b=5.35e-37*f.Z*f.ne*f.ne*Math.sqrt(T); const den=q?(1+f.fch)*pf-b:f.fch*pf-b; if(den<=0){first=true;continue;} const ntt=T*1.5*(f.ne+1)*T*1.602e-16/den; if(ntt<Math.pow(10,y0)||ntt>Math.pow(10,y1)){first=true;continue;} const px=X(T),py=Y(ntt); if(first){x.moveTo(px,py);first=false;} else x.lineTo(px,py); } x.stroke(); };
  x.lineWidth=2.5; x.strokeStyle=C('--plasma'); curve(false); x.setLineDash([5,4]); x.strokeStyle=C('--good'); curve(true); x.setLineDash([]);
  const ntt=st.fu.n*st.fu.T*st.fu.tau, cx=X(Math.min(1000,Math.max(1,st.fu.T))), cy=Y(Math.min(Math.pow(10,y1),Math.max(Math.pow(10,y0),ntt)));
  x.fillStyle=C('--hot'); x.beginPath(); x.arc(cx,cy,5,0,7); x.fill();
  x.font='600 11.5px "Noto Sans KR", sans-serif'; x.fillStyle=C('--ink'); x.fillText(L('로슨 도표  nTτ (keV·s/m³) – T (keV)','Lawson diagram  nTτ (keV·s/m³) vs T (keV)'),pl,13);
  x.textAlign='right'; x.fillStyle=C('--plasma'); x.fillText(L('— 점화','— ignition'),w-pr,13); x.fillStyle=C('--good'); x.fillText(L('- - Q = 1','- - Q = 1'),w-pr-70,13); x.textAlign='left';
}
function seriesDraw(r){
  const svg=$('#ec-series'); if(!svg) return; const list=Object.values(HC).sort((a,b)=>a.E-b.E), lo=-2.6, hi=1.65, X=E=>14+(E-lo)/(hi-lo)*372;
  const e=st.ec, aL=HC[e.L], aR=HC[e.R];
  let o=`<line x1="14" x2="386" y1="44" y2="44" style="stroke:var(--line);stroke-width:6;stroke-linecap:round"/>`;
  o+=`<line x1="${X(Math.min(r.EL,r.ER))}" x2="${X(Math.max(r.EL,r.ER))}" y1="44" y2="44" style="stroke:var(--accent);stroke-width:6;stroke-linecap:round;opacity:.85"/>`;
  list.forEach((h,i)=>{ const xx=X(h.E), on=h===aL||h===aR, row=i%3, up=row===0, ty=row===0?28:row===1?68:84; o+=`<line x1="${xx}" x2="${xx}" y1="${up?34:44}" y2="${up?44:(row===1?56:72)}" style="stroke:${on?'var(--accent)':'var(--muted)'};stroke-width:${on?2:1}"/><text x="${xx}" y="${ty}" text-anchor="middle" style="font:${on?800:500} ${on?12:10.5}px var(--f-mono);fill:${on?'var(--accent)':'var(--muted)'}">${h.inert?(h.id==='Fe3'?'Fe³⁺':h.id==='O2'?'O₂':h.id==='Cl'?'Cl₂':h.id==='I'?'I₂':'H₂'):h.id}</text>`; });
  o+=`<text x="14" y="106" style="font:600 10.5px var(--f-body);fill:var(--muted)">${L('← 산화되기 쉬움 (−)','← easily oxidised (−)')}</text><text x="386" y="106" text-anchor="end" style="font:600 10.5px var(--f-body);fill:var(--muted)">${L('환원되기 쉬움 (+) →','easily reduced (+) →')}</text>`;
  svg.innerHTML=o;
}
/* ───────────── 루프 ───────────── */
function step(){
  tick++; if(st.view&&st.view!=='game') return; const b=B(), dt=0.1;
  b.T+= (b.Tset-b.T)*(1-Math.exp(-dt/4));
  if(st.mode==='stage'){
    const drain=Math.log10(1+Math.abs(b.Tset-25)/40)*1.6+(b.P>1?Math.log10(b.P)*0.6:0)+(b.P<1?Math.log10(1/b.P)*0.4:0)+(b.uv?1.2:0);
    if(drain<0.05) st.energy=Math.min(100,st.energy+2*dt); else st.energy=Math.max(0,st.energy-drain*dt);
    if(st.energy<=0&&(Math.abs(b.Tset-25)>1||Math.abs(b.P-1)>0.01||b.uv)){ b.Tset=25; b.P=1; b.uv=false; syncUV(); syncSliders(); pushLog({ok:false,ms:{},msg:st.lang==='en'?'Energy ran out, so the heater and compressor shut off. Energy recharges at room temperature and pressure; exothermic reactions can still heat the reactor.':'에너지가 바닥나 가열·가압 장치가 꺼졌어요. 상온·상압에서 에너지가 다시 충전돼요. 발열 반응으로 온도를 올리는 방법도 있어요.'}); }
  }
  if(tick%2===0&&!drag) gravity();
  if(tick%3===0) phaseScan();
  if(tick%7===0&&!drag) autoTick();
  if(tick%5===0){ checkGoals(); checkLab(); }
  if(tick%40===0) save();
  renderBoard(); if(tick%2===0){ renderHUD(); renderGoals(); }
  if(tick%10===0) renderShopCoins();
}
let lastCoins=-1; function renderShopCoins(){ if(st.coins!==lastCoins){ lastCoins=st.coins; renderShop(); } }
function save(){ try{ localStorage.setItem('reactor-v1',JSON.stringify(st)); }catch(_){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem('reactor-v1')||'null'); if(s&&s.v===1&&s.boards) return s; }catch(_){} return null; }
function boot(data){
  st=(data&&data.state&&data.state.v===1)?data.state:load();
  if(!st){ st=fresh(); fillStage(); fillLab(); }
  st.view=st.view||'game'; st.ec=Object.assign({L:'Zn',R:'Cu',cL:1,cR:1,T:25,mode:'cell',V:150},st.ec||{}); st.fu=Object.assign({fuel:'DT',T:10,n:1e20,tau:1},st.fu||{}); st.found.ec=st.found.ec||{}; st.found.fu=st.found.fu||{};
  st.lang=st.lang||'ko'; ecBuild(); fuBuild(); applyTheme(); applyLang(); renderLog(); renderShop(); setMode(st.view==='game'?st.mode:st.view);
  if(!window.__reactorLoop) window.__reactorLoop=setInterval(step,100);
}
try{ window.claude?.hot?.snapshot?.(()=>({state:st})); }catch(_){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data??{});
})();
