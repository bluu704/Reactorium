name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Build mobile web (www/index.html)
        run: python3 scripts/build.py

      - name: Create Android project and icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1f2f86' --splashBackgroundColor '#0d1221'
          npx cap sync android

      - name: Set version from run number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../Reactorium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reactorium-apk
          path: Reactorium.apk

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reactorium.apk
